[project]
name = "flash-mamba-rl"
version = "0.0.1"
description = "RL-discovered Triton kernels for Mamba-3's full training stack, with a contract-grounded verifier."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishi Shah", email = "rishishah994@gmail.com" }]
keywords = ["mamba", "ssm", "triton", "gpu-kernels", "rl", "grpo", "blackwell", "ptb-xl"]

dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "einops>=0.8",
    "psutil>=5.9",
    "rich>=13.7",
]

[project.optional-dependencies]
gpu = [
    "triton>=3.0; sys_platform == 'linux'",
]
rl = [
    "transformers>=4.45",
    "accelerate>=0.34",
    "tokenizers>=0.20",
    "peft>=0.13",
]
medical = [
    "wfdb>=4.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]
all = [
    "flash-mamba-rl[gpu,rl,medical,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flash_mamba_rl"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipython>=8.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "blackwell: requires a Blackwell (B200/GB200) GPU",
    "slow: takes more than 10s to run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/cheating_kernels/*" = ["F841", "B007"]  # intentionally-broken kernels
# The tcgen05 DSL kernels use Unicode math (−, exp2 sums) in their docstrings/
# comments to mirror the reference derivation; keep the notation verbatim.
"src/flash_mamba_rl/kernels/cute/gdn2_bwd_*.py" = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/flash_mamba_rl"]

[[tool.mypy.overrides]]
module = ["triton.*", "wfdb.*", "pandas.*", "mamba_ssm.*", "causal_conv1d.*", "transformers.*", "peft.*", "fla.*", "cula.*", "kda.*", "cutlass.*", "cuda.*"]
ignore_missing_imports = true

# The native tcgen05 DSL kernels are box-only: they import cutlass/cute under a
# guarded try and use @cute.jit / @cute.struct constructs that strict mypy cannot
# type. They are exercised on-silicon (the crown gate), never statically. Skip them.
[[tool.mypy.overrides]]
module = [
    "flash_mamba_rl.kernels.cute.gdn2_bwd_dhu",
    "flash_mamba_rl.kernels.cute.gdn2_bwd_wy",
    "flash_mamba_rl.kernels.cute.gdn2_bwd_dhu_cw",
    "flash_mamba_rl.kernels.cute.gdn2_bwd_dhu_l2",
    "flash_mamba_rl.kernels.cute.gdn2_bwd_wy_cw",
]
ignore_errors = true
